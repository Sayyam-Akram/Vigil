services:
  - type: web
    name: vigil-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BRIGHT_DATA_SERP_ZONE
        value: vendorsentinel_serp
      - key: BRIGHT_DATA_UNLOCKER_ZONE
        value: vendorsentinel_unlocker
      - key: BRIGHT_DATA_CUSTOMER_ID
        value: hl_fa46abf7
      - key: BRIGHT_DATA_BROWSER_ZONE
        value: vendorsentinel_browser

      # Secret variables - Render will prompt you to input these securely during launch
      - key: BRIGHT_DATA_API_KEY
        sync: false
      - key: BRIGHT_DATA_BROWSER_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
